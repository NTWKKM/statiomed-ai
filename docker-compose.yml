services:
  statiomed-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statiomed-ai
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PYTHONUNBUFFERED=1
      - SYSTEM=spaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
