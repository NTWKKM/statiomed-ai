# StatioMed AI (statiomed-ai)
# Clinical Research & Biostatistical Co-Pilot
# Requires Python 3.12+ for PEP 695 Type Parameter Syntax

[project]
name = "statiomed-ai"
version = "0.1.0"
requires-python = ">=3.12"
description = "Agentic Medical Statistical Analysis & Study Design Platform built with Shiny for Python and smolagents"
authors = [
    { name = "StatioMed Team" }
]
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
